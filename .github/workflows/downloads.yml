name: Download consistency
on:
  pull_request:
  push:
    branches: [main]
  deployment_status:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:downloads
      - run: npm run test:provider-order
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:local
      - run: npm run smoke:downloads -- https://keykeeper.dev/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-smoke
          path: test-results/**/*.png
          retention-days: 7
  production-smoke:
    if: >-
      github.event_name == 'deployment_status' &&
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.production_environment == true ||
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:downloads
      - run: npm run smoke:downloads -- https://keykeeper.dev/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-download-smoke
          path: test-results/download-smoke/*.png
          retention-days: 7
